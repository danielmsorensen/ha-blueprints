# One or more instances per blueprint. CI runs HA's check_config, which
# substitutes these inputs and validates the resulting automations.
# Entity IDs don't need to exist.

- id: ci_task_sync_bins
  alias: "CI task_sync: bins, all inputs"
  use_blueprint:
    path: household/task_sync.yaml
    input:
      calendars:
        - calendar.general_waste
        - calendar.recycling
        - calendar.garden
      start_time: "15:00:00"
      expire_time: "09:00:00"
      task_key: bins
      task_name: "{{ events }}"
      todo_entities:
        - todo.household_tasks
        - todo.google_tasks
      people:
        - person.one
        - person.two
      notify_script: script.notify_people_at_home
      notification_title: Bin Night
      done_label: Mark completed
      sync_interval: 2

- id: ci_task_sync_minimal
  alias: "CI task_sync: defaults only"
  use_blueprint:
    path: household/task_sync.yaml
    input:
      calendars:
        - calendar.plants
      task_key: plants
      todo_entities:
        - todo.household_tasks
      people:
        - person.one
      notify_script: script.notify_people_at_home_defaults
